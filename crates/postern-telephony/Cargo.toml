[package]
name = "postern-telephony"
version = "0.1.0"
edition = "2021"
description = "Postern Labs carrier-telephony core — SMS + cellular voice for Postern OS Mobile via ModemManager over D-Bus (fresh MIT/Apache client, never a fork of GPL clients), with an encrypted-at-rest local store for messages and the call log."
license = "MIT OR Apache-2.0"

[lib]
name = "postern_telephony"

# The B4 live-device probe (needs the D-Bus client layer, hence `dbus`, which is
# on by default). Skipped under `--no-default-features` (pure-core builds).
[[bin]]
name = "postern-telephony-probe"
path = "src/bin/postern-telephony-probe.rs"
required-features = ["dbus"]

# ── Workspace note (for the lead) ────────────────────────────────────────────
# This crate is deliberately SELF-CONTAINED so it cannot break the root build.
# To wire it into the repo workspace: add "crates/postern-telephony" to the
# root Cargo.toml [workspace] members AND delete the empty [workspace] table
# below (a member crate must not declare its own workspace).
[workspace]

[features]
# `dbus` (default) compiles the ModemManager / mmsd-tng / callaudiod D-Bus
# client layer (zbus). It COMPILES on any host; it only *connects* on a Linux
# phone with a system bus + a real modem/SIM. `--no-default-features` leaves
# the pure, host-testable core: data models + encrypted store.
default = ["dbus"]
dbus = ["dep:zbus", "dep:tokio", "dep:futures-util"]

[dependencies]
# The one canonical Postern seal (XChaCha20-Poly1305 AEAD + Argon2id KDF) —
# same engine as postern-vault, so the message store / call log cannot drift
# on wire format or parameters. MIT OR Apache-2.0 (in-house).
postern-core = { path = "../postern-core" }
zeroize = { version = "1", features = ["derive"] }  # MIT OR Apache-2.0 — wipe plaintext from RAM
thiserror = "2"                                     # MIT OR Apache-2.0

# D-Bus client. zbus is MIT — pure-Rust, no libdbus link. We talk to the GPL
# system daemons (ModemManager, mmsd-tng, callaudiod) ONLY over D-Bus IPC —
# process boundary, no fork, no embed — which the repo license rule permits
# (like syscalls into the GPL kernel).
zbus = { version = "5", default-features = false, features = ["tokio"], optional = true }  # MIT
tokio = { version = "1", features = ["rt", "macros", "time"], optional = true }            # MIT
futures-util = { version = "0.3", default-features = false, optional = true }              # MIT OR Apache-2.0 — signal streams

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
