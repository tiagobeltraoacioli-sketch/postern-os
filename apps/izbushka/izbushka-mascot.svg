<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="240" height="260">
  <!-- Izbushka: the cute hut on chicken legs, with Yagabona peeking out.
       Postern Labs · Yagabona/Izbushka cursor companion mascot -->
  <defs>
    <linearGradient id="roofG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d5a3b"/>
      <stop offset="1" stop-color="#6e4128"/>
    </linearGradient>
    <linearGradient id="wallG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a86c"/>
      <stop offset="1" stop-color="#c08d52"/>
    </linearGradient>
    <radialGradient id="windowGlow" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="1" stop-color="#f2b84b"/>
    </radialGradient>
  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="120" cy="244" rx="62" ry="10" fill="#000" opacity="0.12"/>

  <!-- chicken legs -->
  <g stroke="#e8a33d" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M100 186 q-4 18 -10 30"/>
    <path d="M140 186 q4 18 10 30"/>
  </g>
  <!-- feet -->
  <g stroke="#e8a33d" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M90 216 l-12 12"/><path d="M90 216 l0 16"/><path d="M90 216 l12 12"/>
    <path d="M150 216 l-12 12"/><path d="M150 216 l0 16"/><path d="M150 216 l12 12"/>
  </g>
  <!-- fluffy leg feathers -->
  <g fill="#f5c46a">
    <circle cx="100" cy="188" r="9"/><circle cx="92" cy="196" r="7"/><circle cx="108" cy="196" r="7"/>
    <circle cx="140" cy="188" r="9"/><circle cx="132" cy="196" r="7"/><circle cx="148" cy="196" r="7"/>
  </g>

  <!-- hut body (log wall) -->
  <rect x="66" y="118" width="108" height="74" rx="14" fill="url(#wallG)" stroke="#8a5a2e" stroke-width="4"/>
  <!-- log lines -->
  <g stroke="#a8763f" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="72" y1="138" x2="168" y2="138"/>
    <line x1="72" y1="156" x2="168" y2="156"/>
    <line x1="72" y1="174" x2="168" y2="174"/>
  </g>

  <!-- roof -->
  <path d="M54 124 L120 62 L186 124 Q120 110 54 124 Z" fill="url(#roofG)" stroke="#4f2d18" stroke-width="4" stroke-linejoin="round"/>
  <!-- roof shingle hint -->
  <path d="M78 106 Q120 96 162 106" stroke="#5c351d" stroke-width="3" fill="none" opacity="0.6"/>
  <!-- tiny chimney with heart smoke -->
  <rect x="142" y="72" width="12" height="20" rx="3" fill="#7a4a2a" stroke="#4f2d18" stroke-width="3"/>
  <path d="M150 62 c-6 -4 -6 -10 0 -12 c6 2 6 8 0 12 Z" fill="#cfe3ef" opacity="0.9"/>
  <circle cx="158" cy="46" r="4" fill="#cfe3ef" opacity="0.7"/>

  <!-- round glowing window with Yagabona peeking -->
  <circle cx="120" cy="150" r="26" fill="url(#windowGlow)" stroke="#8a5a2e" stroke-width="4"/>
  <!-- window cross frame behind her -->
  <line x1="120" y1="124" x2="120" y2="132" stroke="#8a5a2e" stroke-width="3"/>
  <!-- Yagabona: tiny kind witch -->
  <g>
    <!-- headscarf -->
    <path d="M104 148 q0 -18 16 -18 q16 0 16 18 l-4 4 q-12 -6 -24 0 Z" fill="#b23a48"/>
    <circle cx="120" cy="128" r="4" fill="#b23a48"/>
    <!-- face -->
    <circle cx="120" cy="152" r="12" fill="#f6d7b0"/>
    <!-- rosy cheeks -->
    <circle cx="112" cy="156" r="2.6" fill="#f0a3a3"/>
    <circle cx="128" cy="156" r="2.6" fill="#f0a3a3"/>
    <!-- happy closed eyes -->
    <path d="M112 150 q3 -3 6 0" stroke="#5a3b22" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M122 150 q3 -3 6 0" stroke="#5a3b22" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- little smile -->
    <path d="M115 158 q5 4 10 0" stroke="#5a3b22" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- waving hand -->
    <circle cx="140" cy="162" r="4.5" fill="#f6d7b0"/>
  </g>

  <!-- tiny door with padlock (privacy!) -->
  <rect x="84" y="160" width="18" height="26" rx="6" fill="#7a4a2a" stroke="#4f2d18" stroke-width="3"/>
  <circle cx="93" cy="173" r="3.4" fill="#f2c14e" stroke="#4f2d18" stroke-width="1.5"/>
  <rect x="90.6" y="170.6" width="4.8" height="4" rx="1" fill="#4f2d18"/>

  <!-- broom leaning on the hut -->
  <g transform="rotate(14 178 170)">
    <line x1="178" y1="130" x2="178" y2="182" stroke="#9c6b3c" stroke-width="4" stroke-linecap="round"/>
    <path d="M170 182 q8 16 16 0 Z" fill="#e0b25e" stroke="#9c6b3c" stroke-width="2"/>
  </g>

  <!-- sparkles -->
  <g fill="#f2c14e">
    <path d="M52 84 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 Z"/>
    <path d="M196 100 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 Z"/>
    <circle cx="66" cy="60" r="2.5"/>
  </g>
</svg>
