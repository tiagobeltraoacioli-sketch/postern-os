# SPDX-License-Identifier: MIT OR Apache-2.0
# Postern Container DPC app shell — UNAUDITED; builds a real debug APK with the
# Android SDK + JDK 17 (`./gradlew :app:assembleDebug`). `built ≠ booted`.

android.useAndroidX=true
# Per-module R classes (smaller, faster; AGP 8 default-on but pinned for clarity).
android.nonTransitiveRClass=true
kotlin.code.style=official

# JVM + build ergonomics for assembleDebug / connected test runs.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
