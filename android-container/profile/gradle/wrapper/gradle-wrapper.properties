## Gradle wrapper for the Postern Container DPC app shell.
## Gradle 8.9 — the version matched to AGP 8.5.0 (requires Gradle >= 8.7) and
## JDK 17. Runs on any host with the Android SDK + JDK 17 (the Nix devshell in
## ../../toolchain/flake.nix is one such host); `./gradlew :app:assembleDebug`
## builds a real debug APK. UNAUDITED · not provisioned on hardware.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
