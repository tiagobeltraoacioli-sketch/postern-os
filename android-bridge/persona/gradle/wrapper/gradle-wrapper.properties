## Gradle wrapper for the NoporIS persona app shell.
## Gradle 8.9 — reconciled to match Porog's pin (android-container/profile/gradle/wrapper,
## same AGP 8.5.0 floor requiring Gradle >= 8.7) so both bridge apps' first box-day
## `./gradlew` runs against one Gradle distribution, not two. Previously pinned 8.7 with
## a distributionSha256Sum for the 8.7 zip (PMO-flagged Porog↔NoporIS version drift,
## bucketA/PARTITION.md, Dev B) — bumped here. The old sha256 is NOT carried forward: it
## verified the 8.7 zip, not 8.9, and this macOS host has no network access to compute
## the correct 8.9 sum without fabricating it (a wrong pin would fail-closed on box,
## which is worse than the unpinned-but-validated approach Porog already uses via
## validateDistributionUrl=true). Re-add distributionSha256Sum on the box once verified.
## SCAFFOLD: this wrapper HAS now run on a macOS host (JDK 17 + local Android SDK) to
## produce a debug APK and green unit tests. Re-add distributionSha256Sum once verified.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
