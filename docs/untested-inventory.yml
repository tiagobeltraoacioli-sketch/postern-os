# untested-inventory.yml — the built-but-UNTESTED / built-but-UNBOOTED ledger
# =============================================================================
# Honesty rail for the four gates (repo-wide, non-negotiable):
#   G1  built  != designed  — a status/badge flips to "built" only when the code
#                             COMPILES and its tests PASS.
#   G2  built  != booted != hardware — compiling is not booting; booting a VM is
#                             not running on real silicon.
#   G3  attestation claims need REAL hardware — a "Genuine"/attested verdict is
#                             a claim only a launched TEE quote can back.
#   G4  unaudited STAYS unaudited until a third party finishes an audit.
#
# This file is the machine-readable companion to scripts/check-trust-labels.sh.
# The script is the mechanical tripwire on the *labels*; this ledger is the
# honest inventory of *what those labels are hiding*: things that exist as code
# but have not crossed the next gate. Source of truth:
#   docs/design/RESUME-DOSSIER-2026-07-16.md (PMO consolidation of 8 area reports).
#
# `stage` vocabulary (each strictly weaker than the next):
#   designed   — spec/scaffold only; no compiling artifact.
#   compiles   — builds, no meaningful test evidence yet.
#   tested     — unit/vector tests PASS on the host (G1 satisfied).  <-- ceiling
#                for almost everything below; NOTHING here is past this.
#   booted     — has run as a VM/emulator process (G2 partial).
#   hardware   — proven on real silicon (G2/G3 satisfied).  <-- NOTHING is here.
#
# RULE: do not flip any `stage` upward here (or any badge elsewhere) without
# fresh, reproducible evidence. "By inspection" is not evidence.
version: 1
generated_from: docs/design/RESUME-DOSSIER-2026-07-16.md
generated_on: 2026-07-16

