    statement: >
      NOTHING in this repository has been validated on real hardware. The SEV-SNP
      verifier has proven REJECTIONS only against a fixture; no "Genuine" verdict
      has ever been produced. No OS image has ever booted. No Android tree has
      ever compiled. Any hardware/attestation claim is therefore GATED (G3).
  - id: unaudited-everywhere
    statement: >
      No product audit is contracted. The base-protocol audit is contracted but
      NOT performed. The `unaudited` badge stays on every product surface (G4).

