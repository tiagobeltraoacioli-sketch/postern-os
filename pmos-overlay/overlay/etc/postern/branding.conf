# Postern for postmarketOS -- branding hooks (community edition).
# Consumed by Postern first-run/about UI and any Postern shell integration.
# These are HINTS for Postern's own surfaces. We do NOT rewrite pmOS's
# /etc/os-release or claim to be a distribution: this is Postern software ON
# postmarketOS, and the branding must never read as "Postern OS".

# Verbatim-honest identity strings (must match MOTD / about-tier.txt).
PRODUCT_NAME="Postern for postmarketOS"
PRODUCT_EDITION="community edition"
TIER="community"                 # lower-trust, non-attestable
ATTESTABLE="false"
POSTERN_SEAL="false"             # the Seal covers Postern OS (Nix) only

# The tier label the first-run/about screen MUST show, verbatim.
TIER_LABEL="Lower-trust, non-attestable tier -- NOT covered by the Postern Seal."

# Where the UI reads the long-form notice and the MOTD from.
ABOUT_TEXT="/usr/share/postern/first-run/about-tier.txt"
MOTD="/etc/motd"

# Optional visual assets (ship real files before referencing on device).
WALLPAPER=""                     # e.g. /usr/share/postern/branding/wallpaper.png
ACCENT_COLOR="#1f6feb"

# Default shell (informational; the meta package pulls in Phosh).
UI_SHELL="phosh"
