#
# Bloch persistence — sealed-at-rest store, thin Rust reference. Standalone crate
# (own workspace) so it `cargo check`s on its own. It REFERENCES the canonical
# Postern seal by path (crates/postern-core :: aead) — the SAME seal
# crates/postern-vault uses for secrets at rest — and does NOT reimplement crypto.

[package]
name = "bloch-comms-persistence"
version = "0.1.0"
edition = "2021"
description = "Bloch org messenger — sealed-at-rest session/message store over the canonical postern-core seal (Business edition only). UNAUDITED reference prototype."
license = "MIT OR Apache-2.0"
publish = false

# Standalone: do not get absorbed into the repo root workspace.
[workspace]

[dependencies]
# The canonical Postern seal (XChaCha20-Poly1305, versioned, key-committing,
# context-bound). Referenced, not forked — the honest at-rest seal, in Rust.
postern-core = { path = "../../../../../crates/postern-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"
